[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  # 22, not 20: @supabase/supabase-js constructs a Realtime client that needs a
  # WebSocket implementation. Node 20 has none natively and the functions throw
  # "Node.js 20 detected without native WebSocket support" at createClient().
  # Node 22 ships native WebSocket, so no "ws" polyfill is needed.
  NODE_VERSION = "22"

# Netlify Functions directory
[functions]
  directory = "netlify/functions"

# SPA fallback — serve index.html for all routes so client-side navigation works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
